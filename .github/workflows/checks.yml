name: Packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validation:
    name: Package and documentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Select validation prerequisites
        id: plan
        run: node scripts/plan-validation.mjs
        env:
          VEM_TEST_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Install required browsers
        if: steps.plan.outputs.browsers != ''
        env:
          VEM_TEST_BROWSERS: ${{ steps.plan.outputs.browsers }}
        run: npx playwright install --with-deps $VEM_TEST_BROWSERS
      - name: Validate affected suites
        if: github.event_name == 'pull_request'
        run: npm run test:affected
        env:
          VEM_TEST_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Validate the complete release surface
        if: github.event_name != 'pull_request'
        run: npm run test:all
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
