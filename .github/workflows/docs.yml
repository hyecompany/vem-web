name: Documentation
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy only if this checkout matches published packages
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      ref:
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ inputs.deploy && 'pages-release' || format('docs-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify published documentation snapshot
    if: inputs.deploy == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - id: verify
        run: node scripts/docs-release.mjs

  build:
    name: Build Documentation
    needs: release
    if: always() && !cancelled() && (inputs.deploy != true || needs.release.outputs.ready == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install documentation browser
        run: npx playwright install --with-deps chromium
      - name: Build and validate documentation
        run: npm run docs:validate
        env:
          BASE_PATH: ""
      - name: Upload Pages Artifact
        if: inputs.deploy == true && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    name: Deploy to GitHub Pages
    if: inputs.deploy == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
