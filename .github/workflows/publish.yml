name: Stage packages

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        description: Package belonging to this release tag
        required: true
        type: choice
        options:
          - packages/data
          - packages/ui
      tag:
        description: Existing release tag to stage
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and stage the selected package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:all
      - name: Check out staging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts
      - name: Stage the release package for approval
        env:
          VEM_PUBLISH_PACKAGE: ${{ inputs.package }}
          VEM_RELEASE_TAG: ${{ inputs.tag }}
        run: node .release-tools/scripts/stage-packages.mjs
