name: Publish packages

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        description: Package belonging to this release tag
        required: true
        type: choice
        options:
          - packages/data
          - packages/ui
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish the selected package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run test:package
      - name: Publish the release package
        env:
          VEM_PUBLISH_PACKAGE: ${{ inputs.package }}
          VEM_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-packages.mjs