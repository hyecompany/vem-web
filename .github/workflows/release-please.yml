name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and release changed packages
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs['packages/data--release_created'] }}
      tag: ${{ steps.release.outputs['packages/data--tag_name'] }}
    steps:
      - name: Create release pull requests and GitHub releases
        id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
